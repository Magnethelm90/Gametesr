<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050805">
<meta name="description" content="GHOST//SHELL – ein kleines Hacking-Puzzle im Terminal-Look. Rein fiktiv, spielbar im Browser.">
<title>GHOST//SHELL</title>
<style>
:root {
  --bg: #050805;
  --panel: #0a110b;
  --fg: #38ff7a;
  --dim: #6fbf8a;
  --faint: #2b5a3b;
  --err: #ff6b6b;
  --warn: #ffd166;
  --info: #6bd6ff;
  --ok: #b9ff66;
  --font: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px);
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--faint);
  font-size: 13px;
}
.logo { font-weight: bold; letter-spacing: .08em; text-shadow: 0 0 8px rgba(56,255,122,.6); }
.progress { color: var(--dim); white-space: nowrap; }
.progress .done { color: var(--ok); }
#out {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
#out div { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.45em; }
.cmd  { color: var(--dim); }
.dim  { color: var(--dim); }
.err  { color: var(--err); }
.warn { color: var(--warn); }
.info { color: var(--info); }
.ok   { color: var(--ok); font-weight: bold; }
.head { color: var(--fg); font-weight: bold; text-shadow: 0 0 8px rgba(56,255,122,.5); }
.logline { font-size: 12.5px; }
.cipher { color: var(--warn); letter-spacing: .04em; }
footer {
  background: var(--panel);
  border-top: 1px solid var(--faint);
  padding: 8px 10px 10px;
}
#chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 8px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
#chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 0 14px;
  font: inherit;
  font-size: 14px;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--faint);
  border-radius: 6px;
  cursor: pointer;
  touch-action: manipulation;
}
.chip:active { background: var(--faint); }
.chip:disabled { color: var(--faint); cursor: not-allowed; }
.chip:focus-visible, #in:focus-visible, #go:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
form { display: flex; align-items: center; gap: 8px; }
#prompt { color: var(--dim); white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
#in {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  font: inherit;
  font-size: 16px; /* verhindert Auto-Zoom auf iOS */
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--faint);
  border-radius: 6px;
  padding: 0 10px;
  caret-color: var(--fg);
}
#go {
  min-height: 44px;
  min-width: 44px;
  font: inherit;
  font-weight: bold;
  color: var(--bg);
  background: var(--fg);
  border: 0;
  border-radius: 6px;
  cursor: pointer;
  touch-action: manipulation;
}
@media (prefers-reduced-motion: no-preference) {
  .head { animation: glow 3s ease-in-out infinite alternate; }
  @keyframes glow { from { text-shadow: 0 0 4px rgba(56,255,122,.3); } to { text-shadow: 0 0 10px rgba(56,255,122,.7); } }
}
@media (min-width: 700px) {
  body { font-size: 16px; }
  #out, header, footer { width: min(900px, 100%); margin: 0 auto; }
  header { border-left: 1px solid var(--faint); border-right: 1px solid var(--faint); }
  footer { border-left: 1px solid var(--faint); border-right: 1px solid var(--faint); }
}
</style>
</head>
<body>
<header>
  <span class="logo">GHOST//SHELL</span>
  <span class="progress" id="progress" aria-label="Fortschritt"></span>
</header>
<main id="out" role="log" aria-live="polite" aria-label="Terminal-Ausgabe"></main>
<footer>
  <div id="chips" aria-label="Schnellbefehle"></div>
  <form id="form" autocomplete="off">
    <span id="prompt" aria-hidden="true">$</span>
    <input id="in" type="text" inputmode="text" enterkeyhint="send"
           autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
           aria-label="Befehl eingeben" placeholder="Befehl eingeben …">
    <button id="go" type="submit" aria-label="Senden">&#9166;</button>
  </form>
</footer>

  /* ---------- Zustand & Speicher ---------- */

  function emptySolved() { var a = []; for (var i = 0; i < LEVEL_COUNT; i++) { a.push(false); } return a; }
  function emptyHints() { var h = {}; for (var i = 1; i <= LEVEL_COUNT; i++) { h[i] = 0; } return h; }
  var state = { solved: emptySolved(), level: 0 };
  var hintCount = emptyHints();
  var resetPending = false;

  function loadProgress() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) { return false; }
      var data = JSON.parse(raw);
      if (data && Array.isArray(data.solved)) {
        // auch aeltere Speicherstaende (weniger Level) bleiben gueltig
        state.solved = emptySolved().map(function (_, i) { return data.solved[i] === true; });
        return state.solved.some(Boolean);
      }
    } catch (e) { /* Speicher nicht verfügbar oder defekt: ohne Speicherstand weiterspielen */ }
    return false;
  }

  function saveProgress() {
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify({ solved: state.solved }));
    } catch (e) { /* Speichern nicht möglich, das Spiel läuft trotzdem */ }
  }

  function clearProgress() {
    try { window.localStorage.removeItem(STORE_KEY); } catch (e) { /* ignorieren */ }
  }

  /* ---------- Ausgabe ---------- */

  var out = document.getElementById('out');
  var input = document.getElementById('in');
  var chipsEl = document.getElementById('chips');
  var promptEl = document.getElementById('prompt');
  var progressEl = document.getElementById('progress');

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var LINE_DELAY = reduceMotion ? 0 : 12;
  var queue = [];
  var pumping = false;

  function print(text, cls) {
    String(text).split('\n').forEach(function (line) { queue.push({ text: line, cls: cls || '' }); });
    if (!pumping) { pumping = true; step(); }
  }

  function step() {
    var item = queue.shift();
    if (!item) { pumping = false; return; }
    var div = document.createElement('div');
    if (item.cls) { div.className = item.cls; }
    div.textContent = item.text;
    out.appendChild(div);
    out.scrollTop = out.scrollHeight;
    if (LINE_DELAY) { setTimeout(step, LINE_DELAY); } else { step(); }
  }

  function printAll(lines, cls) { lines.forEach(function (l) { print(l, cls); }); }

  /* ---------- Oberfläche: Prompt, Fortschritt, Chips ---------- */

    progressEl.innerHTML = dots.join(' ');

    var s = state.solved;
    if (state.level === 0) {
      var next = s.indexOf(false) + 1;

    if (state.level === 1) {

    } else if (state.level === 2) {
      base = [
        { c: 'nachricht' }, { c: 'analyse' }, { c: 'shift ', fill: true }, { c: 'code ', fill: true }

    } else if (state.level === 3) {
      base = [
        { c: 'log' }, { c: 'suche fehler' }, { c: 'suche erfolg' },
        { c: 'suche download' }, { c: 'taeter ', fill: true }
      ];
    } else if (state.level === 4) {
      base = [{ c: 'dump' }, { c: 'base64 ', fill: true }, { c: 'schluessel ', fill: true }];

      base = [{ c: 'signal' }, { c: 'byte ', fill: true }, { c: 'bin ', fill: true }, { c: 'pin ', fill: true }];
    } else if (state.level === 6) {

  function renderChips() {
    chipsEl.textContent = '';
    chipList().forEach(function (chip) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = chip.c.trim() + (chip.fill ? ' …' : '');
      b.disabled = !!chip.off;
      b.addEventListener('mousedown', function (e) { e.preventDefault(); }); // Fokus/Tastatur behalten
      b.addEventListener('click', function () {
        if (chip.fill) {
          input.value = chip.c;
          input.focus();
        } else {
          run(chip.c);
        }
      });
      chipsEl.appendChild(b);
    });
  }

  /* ---------- Hilfsfunktionen ---------- */

  function norm(s) {
    return String(s).toLowerCase()
      .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
  }

  function caesar(text, shift) {
    return text.replace(/[A-Z]/g, function (ch) {
      return String.fromCharCode((ch.charCodeAt(0) - 65 + shift + 26 * 2) % 26 + 65);
    });
  }

  function cipherText() { return caesar(L2_PLAIN, L2_SHIFT); }

  function rot13(text) {
    return text.replace(/[A-Za-z]/g, function (ch) {
      var base = ch <= 'Z' ? 65 : 97;
      return String.fromCharCode((ch.charCodeAt(0) - base + 13) % 26 + base);
    });
  }

  function toHex(text) {
    return text.split('').map(function (c) { return ('0' + c.charCodeAt(0).toString(16)).slice(-2); }).join('');
  }

  function fromHex(text) {
    var h = text.replace(/\s+/g, '').replace(/^0x/i, '');
    if (!h || h.length % 2 || !/^[0-9a-fA-F]+$/.test(h)) { return null; }
    var r = '';
    for (var i = 0; i < h.length; i += 2) { r += String.fromCharCode(parseInt(h.substr(i, 2), 16)); }
    return /^[\x20-\x7e]+$/.test(r) ? r : null;
  }

  function toBits(text) {
    return text.split('').map(function (c) { return ('00000000' + c.charCodeAt(0).toString(2)).slice(-8); });
  }

  function printableOrNull(str) { return /^[\x20-\x7e]+$/.test(str) ? str : null; }

  function fromBase64(text) {
    try {
      var clean = text.replace(/\s+/g, '');
      if (!/^[A-Za-z0-9+\/]+={0,2}$/.test(clean)) { return null; }
      return printableOrNull(atob(clean));
    } catch (e) { return null; }
  }

  function base64Text() { return btoa(L4_PLAIN); }

      printAll(['', 'MISSION 4:', 'dump ............. Datenpaket anzeigen', 'base64 <text> .... Base64 zurückverwandeln', 'schluessel <wort>  Schlüsselwort abgeben']);
    } else if (state.level === 5) {
      printAll(['', 'MISSION 5:', 'signal ........... Bitfolge anzeigen', 'byte <n> ......... n-tes Zeichen (8 Bit) entschlüsseln', 'bin <bits> ....... Bits in Text umwandeln', 'pin <zahl> ....... PIN abgeben']);
    } else if (state.level === 6) {
      printAll(['', 'MISSION 6:', 'scan ............. Netzwerk-Scan anzeigen', 'info <host> ...... Details zu einem Rechner', 'ziel <host> ...... Schwächsten Rechner melden']);
    } else if (state.level === 7) {
      printAll(['', 'MISSION 7:', 'dateien / lies <datei>', 'rot13 <text> ..... ROT13 umkehren', 'hex <text> ....... Hex in Text umwandeln', 'umkehren <text> .. Text rückwärts lesen', 'tresor <a-b-c> ... Tresor öffnen']);
    }
    print('Tipp: Auf dem Handy kannst du die Knöpfe unten antippen.', 'dim');
  }

  function showStatus() {
    print('');
    print('FORTSCHRITT', 'head');
    for (var i = 1; i <= LEVEL_COUNT; i++) {
      print('Level ' + i + ' (' + TITLES[i] + '): ' + (state.solved[i - 1] ? 'gelöst' : 'offen'), state.solved[i - 1] ? 'ok' : '');
    }
  }

  function startLevel(n) {
    if (!(n >= 1 && n <= LEVEL_COUNT)) {
      print('Unbekanntes Level. Verfügbar: 1 bis ' + LEVEL_COUNT + '.', 'err');
      return;
    }
    if (n > 1 && !state.solved[n - 2]) {
      print('Level ' + n + ' ist gesperrt. Löse zuerst Level ' + (n - 1) + '.', 'err');
      return;
    }
    state.level = n;
    refresh();
    print('');
    print('=== MISSION ' + n + ': ' + TITLES[n].toUpperCase() + ' ===', 'head');
    if (n === 1) {
      printAll([
        'Ziel: Server NEBULA-7 (frei erfunden).',
        'Das Konto "mfalke" ist passwortgeschützt. Finde heraus, wie das Passwort lautet.',
        '',
        'Befehle: dateien, lies <datei>, login <passwort>, hinweis'
      ]);
    } else if (n === 2) {
      printAll([
        'Du hast einen verschlüsselten Funkspruch abgefangen.',
        'Er wurde mit einer Caesar-Chiffre verschlüsselt. Finde die Verschiebung und das Codewort.',
        '',
        'Befehle: nachricht, analyse, shift <1-25>, code <wort>, hinweis'
      ]);
      print('');
      print(cipherText(), 'cipher');
    } else if (n === 3) {
      printAll([
        'Auf dem Gateway wurde etwas gestohlen. Die Logdatei (heute) liegt vor.',
        'Finde die IP-Adresse des Eindringlings.',
        '',
        'Befehle: log, suche <begriff>, taeter <ip>, hinweis'
      ]);
    } else if (n === 4) {
      printAll([
        'Im Datendepot liegt ein Datenpaket. Es sieht aus wie wirres Zeug, ist aber Base64-kodiert.',
        'Wandle es zurück und finde das Schlüsselwort.',
        '',
        'Befehle: dump, base64 <text>, schluessel <wort>, hinweis'
      ]);
    } else if (n === 5) {
      printAll([
        'Ein Türsteuerungs-Signal wurde mitgeschnitten: nur Nullen und Einsen.',
        'Jede Gruppe aus 8 Bits ist ein Zeichen. Finde die PIN.',
        '',
        'Befehle: signal, byte <n>, bin <bits>, pin <zahl>, hinweis'
      ]);
    } else if (n === 6) {
      printAll([
        'Du prüfst ein (frei erfundenes) Firmennetz als Sicherheitsberater.',
        'Finde den Rechner, der am dringendsten abgesichert werden muss.',
        '',
        'Befehle: scan, info <host>, ziel <host>, hinweis'
      ]);
    } else {
      printAll([
        'Das Finale: ein Tresor, geschützt durch drei Teile, jeder anders verschleiert.',
        'Entschlüssele alle drei und öffne den Tresor.',
        '',
        'Befehle: dateien, lies <datei>, rot13, hex, umkehren, tresor <a-b-c>, hinweis'
      ]);
    }
  }

  function showHint() {
    if (state.level === 0) { print('Wähle zuerst ein Level: "level 1".', 'warn'); return; }
    var list = HINTS[state.level];
    var i = Math.min(hintCount[state.level], list.length - 1);
    print('HINWEIS ' + (i + 1) + '/' + list.length + ': ' + list[i], 'warn');
    if (hintCount[state.level] < list.length) { hintCount[state.level]++; }
  }

  function solve(n) {
    state.solved[n - 1] = true;
    saveProgress();
    print('');
    print('>>> ZUGRIFF GEWÄHRT <<<', 'ok');
    print('Mission ' + n + ' abgeschlossen!', 'ok');
    if (n < LEVEL_COUNT) {
      state.level = 0;
      refresh();
      print('Weiter mit "level ' + (n + 1) + '".', 'dim');
    } else {
      state.level = 0;
      refresh();
      printAll([
        '',
        '*** ALLE MISSIONEN GELÖST ***',
        'Du hast alle sieben Rätsel geknackt. Gut gemacht, Ghost.',
        'Alles hier war frei erfunden. Nutze dein Wissen nur legal und verantwortungsvoll.'
      ], 'ok');
      print('Tippe "level 1" zum erneuten Spielen oder "reset" für einen frischen Start.', 'dim');
    }
  }

  /* ---------- Level-Befehle ---------- */

  function fileCmd(files, cmd, arg) {
    if (cmd === 'dateien' || cmd === 'ls') {
      printAll(Object.keys(files));
      return true;
    }
    if (cmd === 'lies' || cmd === 'cat') {
      if (!arg) { print('Benutzung: lies <datei>   (siehe "dateien")', 'warn'); return true; }
      var name = norm(arg);
      var key = Object.keys(files).filter(function (k) { return k === name || k.split('.')[0] === name; })[0];
      if (!key) { print('Datei nicht gefunden: ' + arg, 'err'); return true; }
      printAll(files[key]);
      return true;
    }
    return false;
  }

  function level1(cmd, arg) {
    if (fileCmd(L1_FILES, cmd, arg)) { return true; }
    if (cmd === 'login') {
      if (!arg) { print('Benutzung: login <passwort>', 'warn'); return true; }
      if (arg.trim().toLowerCase() === L1_PASSWORD) {
        solve(1);
      } else {
        print('Zugriff verweigert. Falsches Passwort.', 'err');
        failCount.l1++;
        if (failCount.l1 % 3 === 0) { print('Tipp: Mit "hinweis" bekommst du Hilfe.', 'dim'); }
      }
      return true;
    }
    return false;
  }

  function level2(cmd, arg) {
    if (cmd === 'nachricht' || cmd === 'funk') {
      print(cipherText(), 'cipher');
      return true;
    }
    if (cmd === 'analyse') {
      var counts = {};
      cipherText().replace(/[A-Z]/g, function (c) { counts[c] = (counts[c] || 0) + 1; });
      var top = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || (a < b ? -1 : 1); }).slice(0, 5);
      print('Häufigste Buchstaben im Funkspruch:', 'dim');
      top.forEach(function (c) { print('  ' + c + ' : ' + counts[c] + 'x'); });
      return true;
    }
    if (cmd === 'shift') {
      var n = /^\d+$/.test(arg) ? parseInt(arg, 10) : NaN;
      if (!(n >= 1 && n <= 25)) { print('Benutzung: shift <zahl von 1 bis 25>', 'warn'); return true; }
      print('shift ' + n + ': ' + caesar(cipherText(), -n), 'info');
      return true;
    }
    if (cmd === 'code') {
      if (!arg) { print('Benutzung: code <wort>', 'warn'); return true; }
      if (norm(arg).toUpperCase().trim() === L2_ANSWER) {
        print('Entschlüsselt: ' + L2_PLAIN, 'info');
        solve(2);
      } else {
        print('Falscher Code. Der Funkspruch bleibt verschlossen.', 'err');
      }
      return true;
    }
    return false;
  }

  function level3(cmd, arg) {
    if (cmd === 'log') {
      print('ZEIT QUELLE EREIGNIS DETAIL', 'dim');
      printAll(L3_LOG, 'logline');
      return true;
    }
    if (cmd === 'suche' || cmd === 'grep') {
      if (!arg) { print('Benutzung: suche <begriff>   z.B. suche fehler', 'warn'); return true; }
      var needle = norm(arg);
      var hits = L3_LOG.filter(function (l) { return norm(l).indexOf(needle) !== -1; });
      if (!hits.length) { print('Keine Treffer.', 'dim'); return true; }
      printAll(hits, 'logline');
      print(hits.length + ' Treffer.', 'dim');
      return true;
    }
    if (cmd === 'taeter' || cmd === 'ip' || cmd === 'melde') {
      var ip = arg.trim();
      if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) { print('Benutzung: taeter <ip-adresse>   z.B. taeter 10.0.0.1', 'warn'); return true; }
      if (ip === L3_ANSWER) {
        print('Eindringling identifiziert: ' + ip, 'info');
        solve(3);
      } else if (L3_LOG.some(function (l) { return l.split(' ')[1] === ip; })) {
        print('Diese IP taucht im Log auf, hat aber nicht gestohlen. Schau genauer hin.', 'err');
      } else {
        print('Diese IP kommt im Log gar nicht vor.', 'err');
      }
      return true;
    }
    return false;
  }

  function level4(cmd, arg) {
    if (cmd === 'dump') { print(base64Text(), 'cipher'); return true; }
    if (cmd === 'base64' || cmd === 'dekodiere') {
      if (!arg) { print('Benutzung: base64 <text>', 'warn'); return true; }
      var plain = fromBase64(arg);
      print(plain === null ? 'Das ist kein gültiges Base64.' : 'Ergebnis: ' + plain, plain === null ? 'err' : 'info');
      return true;
    }
    if (cmd === 'schluessel' || cmd === 'code') {
      if (!arg) { print('Benutzung: schluessel <wort>', 'warn'); return true; }
      if (arg.trim().toUpperCase() === L4_ANSWER) { solve(4); } else { print('Falsches Schlüsselwort.', 'err'); }
      return true;
    }
    return false;
  }

  function level5(cmd, arg) {
    var bits = toBits(L5_PLAIN);
    if (cmd === 'signal') {
      print(bits.join(' '), 'cipher');
      print(bits.length + ' Gruppen. Mit "byte <n>" entschlüsselst du die n-te.', 'dim');
      return true;
    }
    if (cmd === 'byte') {
      var n = /^\d+$/.test(arg) ? parseInt(arg, 10) : NaN;
      if (!(n >= 1 && n <= bits.length)) { print('Benutzung: byte <1-' + bits.length + '>', 'warn'); return true; }
      var code = parseInt(bits[n - 1], 2);
      print(bits[n - 1] + ' = ' + code + ' = "' + String.fromCharCode(code) + '"', 'info');
      return true;
    }
    if (cmd === 'bin') {
      var clean = arg.replace(/\s+/g, '');
      if (!/^[01]+$/.test(clean) || clean.length % 8) { print('Benutzung: bin <Bits>, Länge muss durch 8 teilbar sein.', 'warn'); return true; }
      var text = '';
      for (var i = 0; i < clean.length; i += 8) { text += String.fromCharCode(parseInt(clean.substr(i, 8), 2)); }
      print('Ergebnis: ' + (printableOrNull(text) || '(nicht lesbar)'), 'info');
      return true;
    }
    if (cmd === 'pin') {
      if (!arg) { print('Benutzung: pin <zahl>', 'warn'); return true; }
      if (arg.trim() === L5_ANSWER) { solve(5); } else { print('Falsche PIN. Die Tür bleibt zu.', 'err'); }
      return true;
    }
    return false;
  }

  function level6(cmd, arg) {
    if (cmd === 'scan') { printAll(L6_SCAN, 'logline'); return true; }
    var host = arg.trim().toLowerCase();
    if (cmd === 'info') {
      if (!host) { print('Benutzung: info <host>', 'warn'); return true; }
      print(L6_INFO.hasOwnProperty(host) ? host + ': ' + L6_INFO[host] : 'Unbekannter Host: ' + arg, L6_INFO.hasOwnProperty(host) ? 'info' : 'err');
      return true;
    }
    if (cmd === 'ziel') {
      if (!host) { print('Benutzung: ziel <host>', 'warn'); return true; }
      if (host === L6_ANSWER) { solve(6); }
      else if (L6_INFO.hasOwnProperty(host)) { print('Dieser Rechner ist solide aufgestellt. Es gibt einen dringenderen Fall.', 'err'); }
      else { print('Unbekannter Host: ' + arg, 'err'); }
      return true;
    }
    return false;
  }

  function level7(cmd, arg) {
    if (fileCmd(L7_FILES, cmd, arg)) { return true; }
    if (cmd === 'rot13') {
      if (!arg) { print('Benutzung: rot13 <text>', 'warn'); return true; }
      print('Ergebnis: ' + rot13(arg), 'info');
      return true;
    }
    if (cmd === 'hex') {
      if (!arg) { print('Benutzung: hex <text>', 'warn'); return true; }
      var r = fromHex(arg);
      print(r === null ? 'Das ist kein gültiger Hex-Text.' : 'Ergebnis: ' + r, r === null ? 'err' : 'info');
      return true;
    }
    if (cmd === 'umkehren') {
      if (!arg) { print('Benutzung: umkehren <text>', 'warn'); return true; }
      print('Ergebnis: ' + arg.split('').reverse().join(''), 'info');
      return true;
    }
    if (cmd === 'tresor') {
      if (!arg) { print('Benutzung: tresor <wort1-wort2-wort3>', 'warn'); return true; }
      if (arg.trim().toUpperCase() === L7_ANSWER) { solve(7); } else { print('Der Tresor bleibt verschlossen.', 'err'); }
      return true;
    }
    return false;
  }

  var failCount = { l1: 0 };

  /* ---------- Befehlsverarbeitung ---------- */

  function run(raw) {
    var text = String(raw).trim();
    if (!text) { return; }
    print('$ ' + text, 'cmd');
    var m = text.match(/^(\S+)\s*([\s\S]*)$/);
    var cmd = norm(m[1]);
    var arg = m[2].trim();

    if (resetPending && !(cmd === 'reset' && norm(arg) === 'ja')) { resetPending = false; }

    switch (cmd) {
      case 'hilfe': case 'help': case '?': showHelp(); break;
      case 'menu': showMenu(); break;
      case 'level': case 'lvl': startLevel(parseInt(arg, 10)); break;
      case 'hinweis': case 'tipp': case 'hint': showHint(); break;
      case 'status': showStatus(); break;
      case 'clear': case 'cls': case 'leeren':
        out.textContent = ''; queue.length = 0; break;
      case 'reset':
        if (norm(arg) === 'ja') {
          state.solved = emptySolved();
          hintCount = emptyHints();
          failCount.l1 = 0;
          clearProgress();
          resetPending = false;
          print('Spielstand gelöscht.', 'warn');
          showMenu();
        } else {
          resetPending = true;
          print('Das löscht deinen gesamten Fortschritt. Zum Bestätigen tippe: reset ja', 'warn');
        }
        break;
      default:
        var handled = false;
        if (state.level === 1) { handled = level1(cmd, arg); }
        else if (state.level === 2) { handled = level2(cmd, arg); }
        else if (state.level === 3) { handled = level3(cmd, arg); }
        else if (state.level === 4) { handled = level4(cmd, arg); }
        else if (state.level === 5) { handled = level5(cmd, arg); }
        else if (state.level === 6) { handled = level6(cmd, arg); }
        else if (state.level === 7) { handled = level7(cmd, arg); }
        if (!handled) { print('Unbekannter Befehl: ' + m[1] + '. Tippe "hilfe".', 'err'); }
    }
    refresh();
  }

  /* ---------- Eingabe ---------- */

  var history = [];
  var histPos = 0;

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value;
    input.value = '';
    if (v.trim()) { history.push(v); histPos = history.length; }
    run(v);
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp' && history.length) {
      e.preventDefault();
      histPos = Math.max(0, histPos - 1);
      input.value = history[histPos];
    } else if (e.key === 'ArrowDown' && history.length) {
      e.preventDefault();
      histPos = Math.min(history.length, histPos + 1);
      input.value = history[histPos] || '';
    }
  });

  /* ---------- Start ---------- */

  function boot() {
    printAll([
      'GHOST//SHELL v1.0',
      'Ein fiktives Hacking-Puzzle. Alle Namen, Server und Daten sind frei erfunden.',
      ''
    ], 'head');
    var returning = loadProgress();
    if (returning) {
      print('Spielstand gefunden. Willkommen zurück, Ghost.', 'ok');
    } else {
      print('Willkommen, Ghost. Deine Aufträge warten.', 'dim');
    }
    showMenu();
  }

  refresh();
  boot();
})();
</script>
