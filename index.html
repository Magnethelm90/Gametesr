<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050805">
<meta name="description" content="GHOST//SHELL – ein kleines Hacking-Puzzle im Terminal-Look. Rein fiktiv, spielbar im Browser.">
<title>GHOST//SHELL</title>
<style>
:root {
  --bg: #050805;
  --panel: #0a110b;
  --fg: #38ff7a;
  --dim: #6fbf8a;
  --faint: #2b5a3b;
  --err: #ff6b6b;
  --warn: #ffd166;
  --info: #6bd6ff;
  --ok: #b9ff66;
  --font: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px);
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--faint);
  font-size: 13px;
}
.logo { font-weight: bold; letter-spacing: .08em; text-shadow: 0 0 8px rgba(56,255,122,.6); }
.progress { color: var(--dim); white-space: nowrap; margin-left: auto; }
.sndbtn {
  min-height: 40px;
  padding: 0 12px;
  font: inherit;
  font-size: 13px;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--faint);
  border-radius: 6px;
  cursor: pointer;
  touch-action: manipulation;
}
.sndbtn[aria-pressed="false"] { color: var(--dim); }
.sndbtn:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
#out {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
#out div { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.45em; }
.cmd  { color: var(--dim); }
.dim  { color: var(--dim); }
.err  { color: var(--err); }
.warn { color: var(--warn); }
.info { color: var(--info); }
.ok   { color: var(--ok); font-weight: bold; }
.head { color: var(--fg); font-weight: bold; text-shadow: 0 0 8px rgba(56,255,122,.5); }
.logline { font-size: 12.5px; }
.cipher { color: var(--warn); letter-spacing: .04em; }
footer {
  background: var(--panel);
  border-top: 1px solid var(--faint);
  padding: 8px 10px 10px;
}
#chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 8px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
#chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 0 14px;
  font: inherit;
  font-size: 14px;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--faint);
  border-radius: 6px;
  cursor: pointer;
  touch-action: manipulation;
}
.chip:active { background: var(--faint); }
.chip:disabled { color: var(--faint); cursor: not-allowed; }
.chip:focus-visible, #in:focus-visible, #go:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
form { display: flex; align-items: center; gap: 8px; }
#prompt { color: var(--dim); white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
#in {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  font: inherit;
  font-size: 16px; /* verhindert Auto-Zoom auf iOS */
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--faint);
  border-radius: 6px;
  padding: 0 10px;
  caret-color: var(--fg);
}
#go {
  min-height: 44px;
  min-width: 44px;
  font: inherit;
  font-weight: bold;
  color: var(--bg);
  background: var(--fg);
  border: 0;
  border-radius: 6px;
  cursor: pointer;
  touch-action: manipulation;
}
@media (prefers-reduced-motion: no-preference) {
  .head { animation: glow 3s ease-in-out infinite alternate; }
  @keyframes glow { from { text-shadow: 0 0 4px rgba(56,255,122,.3); } to { text-shadow: 0 0 10px rgba(56,255,122,.7); } }
}
@media (min-width: 700px) {
  body { font-size: 16px; }
  #out, header, footer { width: min(900px, 100%); margin: 0 auto; }
  header { border-left: 1px solid var(--faint); border-right: 1px solid var(--faint); }
  footer { border-left: 1px solid var(--faint); border-right: 1px solid var(--faint); }
}
</style>
</head>
<body>
<header>
  <span class="logo">GHOST//SHELL</span>
  <span class="progress" id="progress" aria-label="Fortschritt"></span>
  <button id="snd" class="sndbtn" type="button" aria-pressed="true" aria-label="Sound ein- oder ausschalten">&#9835; AN</button>
</header>
<main id="out" role="log" aria-live="polite" aria-label="Terminal-Ausgabe"></main>
<footer>
  <div id="chips" aria-label="Schnellbefehle"></div>
  <form id="form" autocomplete="off">
    <span id="prompt" aria-hidden="true">$</span>
    <input id="in" type="text" inputmode="text" enterkeyhint="send"
           autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
           aria-label="Befehl eingeben" placeholder="Befehl eingeben …">
    <button id="go" type="submit" aria-label="Senden">&#9166;</button>
  </form>
</footer>

  var WORDS5 = ['NACHT', 'FALKE', 'KABEL', 'MAUER', 'NEBEL', 'PIXEL', 'CLOUD', 'LOGIN', 'ADMIN', 'SPION', 'AGENT', 'VIRUS', 'DATEN', 'PROXY', 'TOKEN', 'TASTE', 'MODEM', 'BYTES'];

    for (i = 0; i < 5; i++) {

  /* ---------- Zustand & Speicher ---------- */

  function emptySolved() { var a = []; for (var i = 0; i < LEVEL_COUNT; i++) { a.push(false); } return a; }
  function emptyHints() { var h = {}; for (var i = 1; i <= LEVEL_COUNT; i++) { h[i] = 0; } return h; }
  var state = { solved: emptySolved(), level: 0 };
  var hintCount = emptyHints();
  var resetPending = false;

  function loadProgress() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) { return false; }
      var data = JSON.parse(raw);
      if (data && Array.isArray(data.solved)) {
        // auch aeltere Speicherstaende (weniger Level) bleiben gueltig
        state.solved = emptySolved().map(function (_, i) { return data.solved[i] === true; });
        return state.solved.some(Boolean);
      }
    } catch (e) { /* Speicher nicht verfügbar oder defekt: ohne Speicherstand weiterspielen */ }
    return false;
  }

  function saveProgress() {
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify({ solved: state.solved }));
    } catch (e) { /* Speichern nicht möglich, das Spiel läuft trotzdem */ }
  }

  function clearProgress() {
    try { window.localStorage.removeItem(STORE_KEY); } catch (e) { /* ignorieren */ }
  }

  /* ---------- Sound (Web Audio, alles synthetisch, keine Dateien) ---------- */

  var SOUND_KEY = 'ghostshell.sound';
  var audio = { ctx: null, on: true, last: {} };

  function loadSound() {
    try { if (window.localStorage.getItem(SOUND_KEY) === '0') { audio.on = false; } } catch (e) { /* Standard: an */ }
  }

  function saveSound() {
    try { window.localStorage.setItem(SOUND_KEY, audio.on ? '1' : '0'); } catch (e) { /* ignorieren */ }
  }

  function actx() {
    if (!audio.on) { return null; }
    if (!audio.ctx) {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) { return null; }
      try { audio.ctx = new Ctor(); } catch (e) { return null; }
    }
    if (audio.ctx.state === 'suspended') { audio.ctx.resume(); }
    return audio.ctx;
  }

  function tone(freq, dur, type, vol, delay) {
    var c = actx();
    if (!c) { return; }
    var t = c.currentTime + (delay || 0);
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol || 0.05, t + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t);
    osc.stop(t + dur + 0.03);
  }

  function throttled(name, ms) {
    var now = Date.now();
    if (audio.last[name] && now - audio.last[name] < ms) { return false; }
    audio.last[name] = now;
    return true;
  }

  var sfx = {
    key: function () { if (throttled('key', 40)) { tone(1500 + Math.random() * 300, 0.025, 'square', 0.02); } },
    enter: function () { tone(520, 0.05, 'square', 0.035); tone(780, 0.05, 'square', 0.03, 0.05); },

    if (!audio.on) { print('Der Sound ist aus. Schalte ihn oben rechts ein oder tippe "sound an".', 'warn'); return; }

  /* ---------- Ausgabe ---------- */

  var out = document.getElementById('out');

  var progressEl = document.getElementById('progress');

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var LINE_DELAY = reduceMotion ? 0 : 12;
  var queue = [];

  function print(text, cls) {
    String(text).split('\n').forEach(function (line) { queue.push({ text: line, cls: cls || '' }); });
    if (!pumping) { pumping = true; step(); }
  }

  function soundFor(item) {
    if (item.cls === 'cmd') { sfx.enter(); }
    else if (item.cls === 'err') { sfx.err(); }
    else if (item.cls === 'ok' && item.text.indexOf('>>>') === 0) { sfx.win(); }
    else if (item.cls === 'ok' && item.text.indexOf('***') === 0) { sfx.fin(); }
    else if (item.cls === 'head' && item.text.indexOf('=== MISSION ') === 0) { sfx.level(); }
  }

  function step() {
    var item = queue.shift();
    if (!item) { pumping = false; return; }
    var div = document.createElement('div');
    if (item.cls) { div.className = item.cls; }
    div.textContent = item.text;
    out.appendChild(div);
    out.scrollTop = out.scrollHeight;
    soundFor(item);
    if (LINE_DELAY) { setTimeout(step, LINE_DELAY); } else { step(); }
  }

  function printAll(lines, cls) { lines.forEach(function (l) { print(l, cls); }); }

  /* ---------- Hilfsfunktionen ---------- */

  function norm(s) {
    return String(s).toLowerCase()
      .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
  }

  function caesar(text, shift) {
    return text.replace(/[A-Z]/g, function (ch) {
      return String.fromCharCode((ch.charCodeAt(0) - 65 + shift + 26 * 2) % 26 + 65);
    });
  }

  function cipherText() { return caesar(L2_PLAIN, L2_SHIFT); }

  function rot13(text) {
    return text.replace(/[A-Za-z]/g, function (ch) {
      var base = ch <= 'Z' ? 65 : 97;
      return String.fromCharCode((ch.charCodeAt(0) - base + 13) % 26 + base);
    });
  }

  function toHex(text) {
    return text.split('').map(function (c) { return ('0' + c.charCodeAt(0).toString(16)).slice(-2); }).join('');
  }

  function fromHex(text) {
    var h = text.replace(/\s+/g, '').replace(/^0x/i, '');
    if (!h || h.length % 2 || !/^[0-9a-fA-F]+$/.test(h)) { return null; }
    var r = '';
    for (var i = 0; i < h.length; i += 2) { r += String.fromCharCode(parseInt(h.substr(i, 2), 16)); }
    return /^[\x20-\x7e]+$/.test(r) ? r : null;
  }

  function toBits(text) {
    return text.split('').map(function (c) { return ('00000000' + c.charCodeAt(0).toString(2)).slice(-8); });
  }

  function printableOrNull(str) { return /^[\x20-\x7e]+$/.test(str) ? str : null; }

  function fromBase64(text) {
    try {
      var clean = text.replace(/\s+/g, '');
      if (!/^[A-Za-z0-9+\/]+={0,2}$/.test(clean)) { return null; }
      return printableOrNull(atob(clean));
    } catch (e) { return null; }
  }

  function base64Text() { return btoa(L4_PLAIN); }

      var open = i === 1 || state.solved[i - 2];

      print('[' + i + '] ' + TITLES[i] + ' ... ' + tag, state.solved[i - 1] ? 'ok' : (open ? '' : 'dim'));
    }
    if (to < LEVEL_COUNT - 1) { print('... (' + (LEVEL_COUNT - 1 - to) + ' weitere Level)', 'dim'); }
    print('');
    print('Starte mit "level <nummer>". Hilfe: "hilfe".', 'dim');
  }

  function startLevel(n) {
    if (!(n >= 1 && n <= LEVEL_COUNT)) {
      print('Unbekanntes Level. Verfügbar: 1 bis ' + LEVEL_COUNT + '.', 'err');
      return;
    }
    if (n > 1 && !state.solved[n - 2]) {
      print('Level ' + n + ' ist gesperrt. Löse zuerst Level ' + (n - 1) + '.', 'err');
      return;
    }
    if (EXTRA[n] && EXTRA[n].start) { EXTRA[n].start(); }
    state.level = n;
    refresh();
    print('');
    print('=== MISSION ' + n + ': ' + TITLES[n].toUpperCase() + ' ===', 'head');
    if (EXTRA[n]) {
      printAll(EXTRA[n].intro);
      if (n === 8) { print(''); print(vigenere(L8_PLAIN, L8_KEY, 1), 'cipher'); }
      if (n === 9) { print(''); print(morseText(), 'cipher'); }
      if (n === 13) { print(''); print(t9Encode(L13_PLAIN), 'cipher'); }
      if (n === 15) { print(''); describeRoom(); }
      if (n === 16) { print(''); print(btoa(rot13(L16_PLAIN.split('').reverse().join(''))), 'cipher'); }

  function showHint() {
    if (state.level === 0) { print('Wähle zuerst ein Level: "level 1".', 'warn'); return; }
    var list = HINTS[state.level];

  function solve(n) {
    state.solved[n - 1] = true;
    saveProgress();
    print('');
    print('>>> ZUGRIFF GEWÄHRT <<<', 'ok');

      state.level = 0;
      refresh();
      print('Weiter mit "level ' + (n + 1) + '".', 'dim');
    } else {
      state.level = 0;
      refresh();
      printAll([
        '',

        'Alles hier war frei erfunden. Nutze dein Wissen nur legal und verantwortungsvoll.'

      print('Tippe "level 1" zum erneuten Spielen oder "reset" für einen frischen Start.', 'dim');

  /* ---------- Level-Befehle ---------- */

  function fileCmd(files, cmd, arg) {
    if (cmd === 'dateien' || cmd === 'ls') {
      printAll(Object.keys(files));
      return true;
    }
    if (cmd === 'lies' || cmd === 'cat') {
      if (!arg) { print('Benutzung: lies <datei>   (siehe "dateien")', 'warn'); return true; }
      var name = norm(arg);
      var key = Object.keys(files).filter(function (k) { return k === name || k.split('.')[0] === name; })[0];
      if (!key) { print('Datei nicht gefunden: ' + arg, 'err'); return true; }
      printAll(files[key]);
      return true;
    }
    return false;
  }

  function level1(cmd, arg) {
    if (fileCmd(L1_FILES, cmd, arg)) { return true; }
    if (cmd === 'login') {
      if (!arg) { print('Benutzung: login <passwort>', 'warn'); return true; }
      if (arg.trim().toLowerCase() === L1_PASSWORD) {
        solve(1);
      } else {
        print('Zugriff verweigert. Falsches Passwort.', 'err');
        failCount.l1++;
        if (failCount.l1 % 3 === 0) { print('Tipp: Mit "hinweis" bekommst du Hilfe.', 'dim'); }
      }
      return true;
    }
    return false;
  }

  function level2(cmd, arg) {
    if (cmd === 'nachricht' || cmd === 'funk') {
      print(cipherText(), 'cipher');
      return true;
    }
    if (cmd === 'analyse') {
      var counts = {};
      cipherText().replace(/[A-Z]/g, function (c) { counts[c] = (counts[c] || 0) + 1; });
      var top = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || (a < b ? -1 : 1); }).slice(0, 5);
      print('Häufigste Buchstaben im Funkspruch:', 'dim');
      top.forEach(function (c) { print('  ' + c + ' : ' + counts[c] + 'x'); });
      return true;
    }
    if (cmd === 'shift') {
      var n = /^\d+$/.test(arg) ? parseInt(arg, 10) : NaN;
      if (!(n >= 1 && n <= 25)) { print('Benutzung: shift <zahl von 1 bis 25>', 'warn'); return true; }
      print('shift ' + n + ': ' + caesar(cipherText(), -n), 'info');
      return true;
    }
    if (cmd === 'code') {
      if (!arg) { print('Benutzung: code <wort>', 'warn'); return true; }
      if (norm(arg).toUpperCase().trim() === L2_ANSWER) {
        print('Entschlüsselt: ' + L2_PLAIN, 'info');
        solve(2);
      } else {
        print('Falscher Code. Der Funkspruch bleibt verschlossen.', 'err');
      }
      return true;
    }
    return false;
  }

  function level3(cmd, arg) {
    if (cmd === 'log') {
      print('ZEIT QUELLE EREIGNIS DETAIL', 'dim');
      printAll(L3_LOG, 'logline');
      return true;
    }
    if (cmd === 'suche' || cmd === 'grep') {
      if (!arg) { print('Benutzung: suche <begriff>   z.B. suche fehler', 'warn'); return true; }
      var needle = norm(arg);
      var hits = L3_LOG.filter(function (l) { return norm(l).indexOf(needle) !== -1; });
      if (!hits.length) { print('Keine Treffer.', 'dim'); return true; }
      printAll(hits, 'logline');
      print(hits.length + ' Treffer.', 'dim');
      return true;
    }
    if (cmd === 'taeter' || cmd === 'ip' || cmd === 'melde') {
      var ip = arg.trim();
      if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) { print('Benutzung: taeter <ip-adresse>   z.B. taeter 10.0.0.1', 'warn'); return true; }
      if (ip === L3_ANSWER) {
        print('Eindringling identifiziert: ' + ip, 'info');
        solve(3);
      } else if (L3_LOG.some(function (l) { return l.split(' ')[1] === ip; })) {
        print('Diese IP taucht im Log auf, hat aber nicht gestohlen. Schau genauer hin.', 'err');
      } else {
        print('Diese IP kommt im Log gar nicht vor.', 'err');
      }
      return true;
    }
    return false;
  }

  function level4(cmd, arg) {
    if (cmd === 'dump') { print(base64Text(), 'cipher'); return true; }
    if (cmd === 'base64' || cmd === 'dekodiere') {
      if (!arg) { print('Benutzung: base64 <text>', 'warn'); return true; }
      var plain = fromBase64(arg);
      print(plain === null ? 'Das ist kein gültiges Base64.' : 'Ergebnis: ' + plain, plain === null ? 'err' : 'info');
      return true;
    }
    if (cmd === 'schluessel' || cmd === 'code') {
      if (!arg) { print('Benutzung: schluessel <wort>', 'warn'); return true; }
      if (arg.trim().toUpperCase() === L4_ANSWER) { solve(4); } else { print('Falsches Schlüsselwort.', 'err'); }
      return true;
    }
    return false;
  }

  function level5(cmd, arg) {
    var bits = toBits(L5_PLAIN);
    if (cmd === 'signal') {
      print(bits.join(' '), 'cipher');
      print(bits.length + ' Gruppen. Mit "byte <n>" entschlüsselst du die n-te.', 'dim');
      return true;
    }
    if (cmd === 'byte') {
      var n = /^\d+$/.test(arg) ? parseInt(arg, 10) : NaN;
      if (!(n >= 1 && n <= bits.length)) { print('Benutzung: byte <1-' + bits.length + '>', 'warn'); return true; }
      var code = parseInt(bits[n - 1], 2);
      print(bits[n - 1] + ' = ' + code + ' = "' + String.fromCharCode(code) + '"', 'info');
      return true;
    }
    if (cmd === 'bin') {
      var clean = arg.replace(/\s+/g, '');
      if (!/^[01]+$/.test(clean) || clean.length % 8) { print('Benutzung: bin <Bits>, Länge muss durch 8 teilbar sein.', 'warn'); return true; }
      var text = '';
      for (var i = 0; i < clean.length; i += 8) { text += String.fromCharCode(parseInt(clean.substr(i, 8), 2)); }
      print('Ergebnis: ' + (printableOrNull(text) || '(nicht lesbar)'), 'info');
      return true;
    }
    if (cmd === 'pin') {
      if (!arg) { print('Benutzung: pin <zahl>', 'warn'); return true; }
      if (arg.trim() === L5_ANSWER) { solve(5); } else { print('Falsche PIN. Die Tür bleibt zu.', 'err'); }
      return true;
    }
    return false;
  }

  function level6(cmd, arg) {
    if (cmd === 'scan') { printAll(L6_SCAN, 'logline'); return true; }
    var host = arg.trim().toLowerCase();
    if (cmd === 'info') {
      if (!host) { print('Benutzung: info <host>', 'warn'); return true; }
      print(L6_INFO.hasOwnProperty(host) ? host + ': ' + L6_INFO[host] : 'Unbekannter Host: ' + arg, L6_INFO.hasOwnProperty(host) ? 'info' : 'err');
      return true;
    }
    if (cmd === 'ziel') {
      if (!host) { print('Benutzung: ziel <host>', 'warn'); return true; }
      if (host === L6_ANSWER) { solve(6); }
      else if (L6_INFO.hasOwnProperty(host)) { print('Dieser Rechner ist solide aufgestellt. Es gibt einen dringenderen Fall.', 'err'); }
      else { print('Unbekannter Host: ' + arg, 'err'); }
      return true;
    }
    return false;
  }

  function level7(cmd, arg) {
    if (fileCmd(L7_FILES, cmd, arg)) { return true; }
    if (cmd === 'rot13') {
      if (!arg) { print('Benutzung: rot13 <text>', 'warn'); return true; }
      print('Ergebnis: ' + rot13(arg), 'info');
      return true;
    }
    if (cmd === 'hex') {
      if (!arg) { print('Benutzung: hex <text>', 'warn'); return true; }
      var r = fromHex(arg);
      print(r === null ? 'Das ist kein gültiger Hex-Text.' : 'Ergebnis: ' + r, r === null ? 'err' : 'info');
      return true;
    }
    if (cmd === 'umkehren') {
      if (!arg) { print('Benutzung: umkehren <text>', 'warn'); return true; }
      print('Ergebnis: ' + arg.split('').reverse().join(''), 'info');
      return true;
    }
    if (cmd === 'tresor') {
      if (!arg) { print('Benutzung: tresor <wort1-wort2-wort3>', 'warn'); return true; }
      if (arg.trim().toUpperCase() === L7_ANSWER) { solve(7); } else { print('Der Tresor bleibt verschlossen.', 'err'); }
      return true;
    }
    return false;
  }

  function vigenere(text, key, dir) {
    var k = 0;
    return text.replace(/[A-Z]/g, function (ch) {
      var shift = key.charCodeAt(k % key.length) - 65;
      k++;
      return String.fromCharCode((ch.charCodeAt(0) - 65 + dir * shift + 26) % 26 + 65);
    });
  }

  function level8(cmd, arg) {
    if (fileCmd(L8_FILES, cmd, arg)) { return true; }
    if (cmd === 'key') {
      var key = norm(arg).toUpperCase().replace(/[^A-Z]/g, '');
      if (!key) { print('Benutzung: key <schluesselwort>', 'warn'); return true; }
      print('Mit "' + key + '": ' + vigenere(vigenere(L8_PLAIN, L8_KEY, 1), key, -1), 'info');
      return true;
    }
    if (cmd === 'losung' || cmd === 'code') {
      if (!arg) { print('Benutzung: losung <wort>', 'warn'); return true; }
      if (norm(arg).toUpperCase().trim() === L8_ANSWER) { solve(8); } else { print('Falsches Lösungswort.', 'err'); }
      return true;
    }
    return false;
  }

  function morseText() {
    return L9_PLAIN.split(' ').map(function (w) {
      return w.split('').map(function (c) { return MORSE[c]; }).join(' ');
    }).join(' / ');
  }

  function level9(cmd, arg) {
    if (cmd === 'funk' || cmd === 'signal') { print(morseText(), 'cipher'); return true; }
    if (cmd === 'abspielen' || cmd === 'hoeren') { playMorse(morseText()); return true; }
    if (cmd === 'tabelle') {
      var letters = Object.keys(MORSE), row = [];
      letters.forEach(function (l, i) {
        row.push(l + ' ' + MORSE[l] + new Array(6 - MORSE[l].length).join(' '));
        if (row.length === 3 || i === letters.length - 1) { print(row.join(' '), 'logline'); row = []; }
      });
      return true;
    }
    if (cmd === 'decode') {
      var code = arg.replace(/[\u00b7\u2022]/g, '.').replace(/[\u2013\u2014]/g, '-');
      if (!/^[.\-\/ ]+$/.test(code)) { print('Benutzung: decode <morse>   (Punkte, Striche, Leerzeichen, "/")', 'warn'); return true; }
      var rev = {};
      Object.keys(MORSE).forEach(function (l) { rev[MORSE[l]] = l; });
      var out2 = code.trim().split(/\s*\/\s*/).map(function (w) {
        return w.split(/\s+/).map(function (c) { return rev.hasOwnProperty(c) ? rev[c] : '?'; }).join('');
      }).join(' ');
      print('Ergebnis: ' + out2, 'info');
      return true;
    }
    if (cmd === 'wort' || cmd === 'code') {
      if (!arg) { print('Benutzung: wort <wort>', 'warn'); return true; }
      if (arg.trim().toUpperCase() === L9_ANSWER) { solve(9); } else { print('Das ist nicht der Treffpunkt.', 'err'); }
      return true;
    }
    return false;
  }

  function level10(cmd, arg) {
    if (fileCmd(L10_FILES, cmd, arg)) { return true; }
    if (cmd === 'botschaft' || cmd === 'code') {
      if (!arg) { print('Benutzung: botschaft <wort>', 'warn'); return true; }
      if (norm(arg).toUpperCase().trim() === L10_ANSWER) { solve(10); } else { print('In den Mails steckt eine andere Botschaft.', 'err'); }
      return true;
    }
    return false;
  }

  function level11(cmd, arg) {
    if (cmd === 'aussagen') { printAll(L11_STATEMENTS); return true; }
    if (cmd === 'regel') {
      printAll(['Genau eine Person ist der Täter.', 'Genau eine der vier Aussagen ist wahr, die anderen drei sind falsch.']);
      return true;
    }
    if (cmd === 'anklagen' || cmd === 'taeter') {
      var name = norm(arg).trim();
      if (!name) { print('Benutzung: anklagen <name>', 'warn'); return true; }
      if (L11_SUSPECTS.indexOf(name) === -1) { print('Diese Person wurde nicht befragt.', 'err'); return true; }
      if (name === L11_ANSWER) { print('Ben gesteht. Die Logik hat ihn überführt.', 'info'); solve(11); }
      else { print('Das passt nicht zu den Aussagen. Zähle nach, wie viele dann wahr wären.', 'err'); }
      return true;
    }
    return false;
  }

  function fsLookup(path) {
    var parts = path.charAt(0) === '/' ? [] : fsCwd.slice();
    path.split('/').forEach(function (p) {
      if (!p || p === '.') { return; }
      if (p === '..') { parts.pop(); } else { parts.push(p); }
    });
    var node = L12_FS;
    for (var i = 0; i < parts.length; i++) {
      if (node.t !== 'd' || !Object.prototype.hasOwnProperty.call(node.c, parts[i])) { return null; }
      node = node.c[parts[i]];
    }
    return { node: node, parts: parts };
  }

  function level12(cmd, arg) {
    if (cmd === 'pwd') { print('/' + fsCwd.join('/'), 'info'); return true; }
    if (cmd === 'ls' || cmd === 'dateien') {
      var words = arg.split(/\s+/).filter(Boolean);
      var all = words.indexOf('-a') !== -1;
      var target = words.filter(function (w) { return w !== '-a'; })[0] || '.';
      var r = fsLookup(target);
      if (!r) { print('ls: ' + target + ': nicht gefunden', 'err'); return true; }
      if (r.node.t === 'f') { print(target); return true; }
      var names = Object.keys(r.node.c).filter(function (n) { return all || n.charAt(0) !== '.'; }).sort();
      print(names.length ? names.map(function (n) { return r.node.c[n].t === 'd' ? n + '/' : n; }).join('  ') : '(leer)');
      return true;
    }
    if (cmd === 'cd') {
      var d = fsLookup(arg.trim() || '/home/ghost');
      if (!d) { print('cd: ' + arg + ': nicht gefunden', 'err'); }
      else if (d.node.t !== 'd') { print('cd: ' + arg + ': ist kein Ordner', 'err'); }
      else { fsCwd = d.parts; }
      return true;
    }
    if (cmd === 'cat' || cmd === 'lies') {
      if (!arg.trim()) { print('Benutzung: cat <datei>', 'warn'); return true; }
      var f = fsLookup(arg.trim());
      if (!f) { print('cat: ' + arg + ': nicht gefunden', 'err'); }
      else if (f.node.t === 'd') { print('cat: ' + arg + ': ist ein Ordner', 'err'); }
      else { printAll(f.node.l); }
      return true;
    }
    if (cmd === 'login') {
      if (!arg) { print('Benutzung: login <passwort>', 'warn'); return true; }
      if (arg.trim().toUpperCase() === L12_ANSWER) { solve(12); } else { print('Zugriff verweigert.', 'err'); }
      return true;
    }
    return false;
  }

  function t9Encode(text) {
    return text.split(' ').map(function (w) {
      return w.split('').map(function (c) {
        for (var k in KEYPAD) {
          if (Object.prototype.hasOwnProperty.call(KEYPAD, k)) {
            var i = KEYPAD[k].indexOf(c);
            if (i !== -1) { return new Array(i + 2).join(k); }
          }
        }
        return '';
      }).join(' ');
    }).join(' / ');
  }

  function level13(cmd, arg) {
    if (cmd === 'sms') { print(t9Encode(L13_PLAIN), 'cipher'); return true; }
    if (cmd === 'tastatur') {
      Object.keys(KEYPAD).forEach(function (k) { print('Taste ' + k + ': ' + KEYPAD[k].split('').join(' ')); });
      return true;
    }
    if (cmd === 't9') {
      var code = arg.trim();
      if (!/^[2-9 \/]+$/.test(code) || !/[2-9]/.test(code)) { print('Benutzung: t9 <code>   (Ziffern 2-9, Leerzeichen, "/")', 'warn'); return true; }
      var res = code.split(/\s*\/\s*/).map(function (w) {
        return w.split(/\s+/).filter(Boolean).map(function (g) {
          if (!/^(\d)\1*$/.test(g) || !KEYPAD[g.charAt(0)] || g.length > KEYPAD[g.charAt(0)].length) { return '?'; }
          return KEYPAD[g.charAt(0)].charAt(g.length - 1);
        }).join('');
      }).join(' ');
      print('Ergebnis: ' + res, 'info');
      return true;
    }
    if (cmd === 'wort' || cmd === 'code') {
      if (!arg) { print('Benutzung: wort <wort>', 'warn'); return true; }
      if (arg.trim().toUpperCase() === L13_ANSWER) { solve(13); } else { print('Das ist nicht der Treffpunkt.', 'err'); }
      return true;
    }
    return false;
  }

  function digitSum(text) {
    return text.replace(/\D/g, '').split('').reduce(function (a, d) { return a + parseInt(d, 10); }, 0);
  }

  function level14(cmd, arg) {
    if (cmd === 'beispiele') { print('Gültige Schlüssel:', 'dim'); printAll(L14_EXAMPLES); return true; }
    if (cmd === 'kandidaten') { print('Prüfe diese Schlüssel:', 'dim'); printAll(L14_CANDIDATES); return true; }
    if (cmd === 'quersumme') {
      if (!/\d/.test(arg)) { print('Benutzung: quersumme <schluessel>', 'warn'); return true; }
      print('Quersumme: ' + arg.replace(/\D/g, '').split('').join(' + ') + ' = ' + digitSum(arg), 'info');
      return true;
    }
    if (cmd === 'aktiviere') {
      var key = arg.trim();
      if (!key) { print('Benutzung: aktiviere <schluessel>', 'warn'); return true; }
      if (key === L14_ANSWER) { solve(14); }
      else if (L14_CANDIDATES.indexOf(key) !== -1) { print('Ungültig. Dieser Schlüssel folgt nicht der Regel.', 'err'); }
      else { print('Das ist keiner der Kandidaten.', 'err'); }
      return true;
    }
    return false;
  }

  var DIRS = { n: 'nord', nord: 'nord', o: 'ost', ost: 'ost', s: 'sued', sued: 'sued', w: 'west', west: 'west' };

  function describeRoom() {
    var r = L15_ROOMS[adv.room];
    print(r.name.toUpperCase(), 'head');
    print(r.text);
    var here = adv.items[adv.room];
    if (here.length) { print('Hier liegt: ' + here.join(', '), 'dim'); }
  }

  function level15(cmd, arg) {
    var thing = norm(arg).trim();
    if (cmd === 'umsehen') { describeRoom(); return true; }
    if (cmd === 'inventar') { print(adv.inv.length ? 'Du trägst: ' + adv.inv.join(', ') : 'Du trägst nichts.', 'info'); return true; }
    if (cmd === 'gehe' || cmd === 'geh' || cmd === 'go') {
      var dir = DIRS[thing];
      if (!dir) { print('Benutzung: gehe <nord|ost|sued|west>', 'warn'); return true; }
      var room = L15_ROOMS[adv.room];
      if (adv.room === 'flur' && dir === 'sued') { print('Die Stahltür ist verschlossen. Du brauchst eine Keycard und den Code.', 'err'); return true; }
      if (!room.exits[dir]) { print('Dort ist eine Wand.', 'err'); return true; }
      adv.room = room.exits[dir];
      refresh();
      describeRoom();
      return true;
    }
    if (cmd === 'nimm') {
      if (!thing) { print('Benutzung: nimm <ding>', 'warn'); return true; }
      var here = adv.items[adv.room], i = here.indexOf(thing);
      if (i === -1) { print('Das gibt es hier nicht.', 'err'); return true; }
      adv.inv.push(here.splice(i, 1)[0]);
      print(thing + ' eingesteckt.', 'info');
      return true;
    }
    if (cmd === 'lies' || cmd === 'untersuche') {
      if (!thing) { print('Benutzung: lies <ding>', 'warn'); return true; }
      if (adv.inv.indexOf(thing) === -1 && adv.items[adv.room].indexOf(thing) === -1) { print('Das siehst du hier nicht.', 'err'); return true; }
      print(L15_TEXTS[thing], 'info');
      return true;
    }
    if (cmd === 'benutze') {
      if (!thing) { print('Benutzung: benutze <ding>', 'warn'); return true; }
      if (adv.inv.indexOf(thing) === -1) { print('Das hast du nicht dabei.', 'err'); return true; }
      if (thing === 'keycard') {
        if (adv.room === 'flur') { adv.card = true; print('Die Karte wird akzeptiert. Der Leser blinkt grün. Jetzt fehlt der Code.', 'info'); }
        else { print('Hier gibt es keinen Kartenleser.', 'err'); }
      } else {
        print('Das bringt dir hier nichts.', 'dim');
      }
      return true;
    }
    if (cmd === 'code') {
      if (adv.room !== 'flur') { print('Hier gibt es kein Zahlenschloss.', 'err'); return true; }
      if (!arg) { print('Benutzung: code <zahl>', 'warn'); return true; }
      if (!adv.card) { print('Das Schloss reagiert nicht. Der Kartenleser ist noch gesperrt.', 'err'); return true; }
      if (arg.trim() === L15_CODE) { print('Die Stahltür öffnet sich. Du betrittst den Serverraum.', 'info'); solve(15); }
      else { print('Falscher Code. Das Schloss piept.', 'err'); }
      return true;
    }
    return false;
  }

  function level16(cmd, arg) {
    if (cmd === 'paket') {
      print(btoa(rot13(L16_PLAIN.split('').reverse().join(''))), 'cipher');
      return true;
    }
    if (cmd === 'base64') {
      if (!arg) { print('Benutzung: base64 <text>', 'warn'); return true; }
      var d = fromBase64(arg);
      print(d === null ? 'Das ist kein gültiges Base64.' : 'Ergebnis: ' + d, d === null ? 'err' : 'info');
      return true;
    }
    if (cmd === 'rot13') {
      if (!arg) { print('Benutzung: rot13 <text>', 'warn'); return true; }
      print('Ergebnis: ' + rot13(arg), 'info');
      return true;
    }
    if (cmd === 'umkehren') {
      if (!arg) { print('Benutzung: umkehren <text>', 'warn'); return true; }
      print('Ergebnis: ' + arg.split('').reverse().join(''), 'info');
      return true;
    }
    if (cmd === 'schluessel' || cmd === 'code') {
      if (!arg) { print('Benutzung: schluessel <wort>', 'warn'); return true; }
      if (arg.trim().toUpperCase() === L16_ANSWER) { solve(16); } else { print('Falsches Schlüsselwort.', 'err'); }
      return true;
    }
    return false;
  }

  function mmScore(secret, guess) {
    var exact = 0, partial = 0;
    for (var i = 0; i < 4; i++) {
      if (guess.charAt(i) === secret.charAt(i)) { exact++; }
      else if (secret.indexOf(guess.charAt(i)) !== -1) { partial++; }
    }
    return { exact: exact, partial: partial };
  }

  function mmLine(t, i) {
    return '#' + (i + 1) + '  ' + t.guess + '  richtig: ' + t.exact + ', falscher Platz: ' + t.partial;
  }

  function level17(cmd, arg) {
    if (cmd === 'verlauf') {
      if (!mm.tries.length) { print('Noch keine Tipps.', 'dim'); } else { mm.tries.forEach(function (t, i) { print(mmLine(t, i)); }); }
      return true;
    }
    if (cmd === 'rate' || cmd === 'code') {
      var g = arg.replace(/\s+/g, '');
      if (!/^\d{4}$/.test(g) || new Set(g.split('')).size !== 4) { print('Benutzung: rate <4 verschiedene Ziffern>   z. B. rate 0123', 'warn'); return true; }
      var sc = mmScore(mm.secret, g);
      var t = { guess: g, exact: sc.exact, partial: sc.partial };
      mm.tries.push(t);
      if (sc.exact === 4) { print(mmLine(t, mm.tries.length - 1), 'ok'); print('Der Tresor öffnet sich nach ' + mm.tries.length + ' Tipps!', 'info'); solve(17); }
      else { print(mmLine(t, mm.tries.length - 1), sc.exact + sc.partial === 0 ? 'dim' : 'info'); }
      return true;
    }
    return false;
  }

  var failCount = { l1: 0 };

  /* ---------- Befehlsverarbeitung ---------- */

  function run(raw) {
    var text = String(raw).trim();
    if (!text) { return; }
    print('$ ' + text, 'cmd');
    var m = text.match(/^(\S+)\s*([\s\S]*)$/);
    var cmd = norm(m[1]);
    var arg = m[2].trim();

    if (resetPending && !(cmd === 'reset' && norm(arg) === 'ja')) { resetPending = false; }

    switch (cmd) {
      case 'hilfe': case 'help': case '?': showHelp(); break;
      case 'menu': showMenu(norm(arg) === 'alle'); break;
      case 'level': case 'lvl': startLevel(parseInt(arg, 10)); break;
      case 'hinweis': case 'tipp': case 'hint': showHint(); break;
      case 'status': showStatus(); break;
      case 'sound':
        if (norm(arg) === 'an' || norm(arg) === 'ein') { setSound(true); print('Sound an.', 'dim'); }
        else if (norm(arg) === 'aus') { setSound(false); print('Sound aus.', 'dim'); }
        else { setSound(!audio.on); print(audio.on ? 'Sound an.' : 'Sound aus.', 'dim'); }
        break;
      case 'clear': case 'cls': case 'leeren':
        out.textContent = ''; queue.length = 0; break;
      case 'reset':
        if (norm(arg) === 'ja') {
          state.solved = emptySolved();
          hintCount = emptyHints();
          failCount.l1 = 0;
          clearProgress();
          resetPending = false;
          print('Spielstand gelöscht.', 'warn');
          showMenu();
        } else {
          resetPending = true;
          print('Das löscht deinen gesamten Fortschritt. Zum Bestätigen tippe: reset ja', 'warn');
        }
        break;
      default:
        var handled = false;
        if (state.level === 1) { handled = level1(cmd, arg); }
        else if (state.level === 2) { handled = level2(cmd, arg); }
        else if (state.level === 3) { handled = level3(cmd, arg); }
        else if (state.level === 4) { handled = level4(cmd, arg); }
        else if (state.level === 5) { handled = level5(cmd, arg); }
        else if (state.level === 6) { handled = level6(cmd, arg); }
        else if (state.level === 7) { handled = level7(cmd, arg); }
        else if (EXTRA[state.level]) { handled = EXTRA[state.level].run(cmd, arg); }
        if (!handled) { print('Unbekannter Befehl: ' + m[1] + '. Tippe "hilfe".', 'err'); }
    }
    refresh();
  }

  /* ---------- Eingabe ---------- */

  var history = [];
  var histPos = 0;

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value;
    input.value = '';
    if (v.trim()) { history.push(v); histPos = history.length; }
    run(v);
  });

  input.addEventListener('keydown', function (e) {
    if (e.key.length === 1 || e.key === 'Backspace') { sfx.key(); }
    if (e.key === 'ArrowUp' && history.length) {
      e.preventDefault();
      histPos = Math.max(0, histPos - 1);
      input.value = history[histPos];
    } else if (e.key === 'ArrowDown' && history.length) {
      e.preventDefault();
      histPos = Math.min(history.length, histPos + 1);
      input.value = history[histPos] || '';
    }
  });

  /* ---------- Start ---------- */

  function boot() {
    printAll([
      'GHOST//SHELL v1.0',
      'Ein fiktives Hacking-Puzzle. Alle Namen, Server und Daten sind frei erfunden.',
      ''
    ], 'head');
    var returning = loadProgress();
    if (returning) {
      print('Spielstand gefunden. Willkommen zurück, Ghost.', 'ok');
    } else {
      print('Willkommen, Ghost. Deine Aufträge warten.', 'dim');
    }
    showMenu();
  }

  document.getElementById('snd').addEventListener('click', function () { setSound(!audio.on); });
  loadSound();
  updateSoundButton();
  refresh();
  boot();
})();
</script>
